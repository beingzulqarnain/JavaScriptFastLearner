<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Class_10_Gallery_App</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="page">
      <h1 id="title">Gallery App</h1>
      <iframe
        src="images/Choose a Picture to Preview.png"
        frameborder="0"
        name="show"
        scrolling="no"
      ></iframe>

      <div id="thumb-box">
        <a href="images/image 1.jpg" target="show">
          <img src="images/image 1.jpg" alt="flower" width="170" />
        </a>

        <a href="images/image 2.jpg" target="show">
          <img src="images/image 2.jpg" alt="flower" width="170" />
        </a>

        <a href="images/image 3.jpg" target="show">
          <img src="images/image 3.jpg" alt="flower" width="170" />
        </a>

        <a href="images/image 4.jpg" target="show">
          <img src="images/image 4.jpg" alt="flower" width="170" />
        </a>
      </div>
    </div>
  </body>
</html>
