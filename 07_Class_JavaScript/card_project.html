<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Card Project - MCQs</title>
    <style>
      body {
        background-color: #f5f5f5;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }

      #card {
        width: 580px;
        border-left: 15px groove red;
        background-color: antiquewhite;
        box-shadow: 0px 16px 8px 0px rgb(0, 0, 0, 0.2);
        padding: 24px;
      }

      #title {
        text-align: center;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        font-size: 30px;
        border-bottom: 1px solid #918b8b;
        padding-bottom: 16px;
      }

      #para {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        font-size: 20px;
      }
      #btn {
        padding: 5px;
        font-family: Verdana, Geneva, Tahoma, sans-serif;
        font-size: 15px;
        margin: 10px;
        border: none;
      }

      #btn:hover {
        background-color: red;
        cursor: pointer;
        color: white;
      }
    </style>

    <script>
      function right() {
        alert("the answer is right");
      }

      function wrong() {
        alert("the answer is wrong");
      }
    </script>
  </head>
  <body>
    <div id="card">
      <h1 id="title">My App</h1>
      <p id="para">What is the full form of HTML Language</p>
      <button id="btn" onclick="right()">HyperText Markup Language</button>
      <button id="btn" onclick="wrong()">HyperText Markup Langage</button>
      <button id="btn" onclick="wrong()">HyperTxt Markup Language</button>
      <button id="btn" onclick="wrong()">HyperText Makup Language</button>
    </div>
  </body>
</html>
