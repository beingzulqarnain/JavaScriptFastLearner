<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Class_12_DOM_JavaScript</title>
  </head>
  <body>
    <h1 id="title">Codethread</h1>
    <p id="desc">
      Lorem ipsum dolor sit amet, consectetur adipisicing elit. Soluta quia,
      distinctio sunt quos enim velit magnam molestiae tempore assumenda
      accusamus, repellat minus?
    </p>

    <img id="images" src="images/image 1.jpg" alt="flower" /> <br /><br /><br />

    <button id="btn" onclick="tryme(this)">Submit</button>

    <script>
      //Code for Title
      const tryme = (btn) => {
        const title = document.getElementById("title");
        title.style.color = "red";
        title.style.fontWeight = "normal";
        title.style.fontSize = "50px";

        //Code for Description

        const desc = document.getElementById("desc");
        desc.style.color = "green";
        desc.style.fontWeight = "normal";
        desc.style.fontSize = "24px";
        desc.style.fontFamily = "san-serif";

        //Code for Button

        //  const btn = document.getElementById('btn');
        btn.style.color = "white";
        btn.style.width = "180px";
        btn.style.backgroundColor = "black";
        btn.style.border = "none";
        btn.style.borderRadius = "24px";
        btn.style.padding = "15px 20px";
        btn.style.cursor = "pointer";
        btn.style.fontSize = "24px";
        btn.style.fontFamily = "san-serif";
        btn.style.fontWeight = "bold";

        //Code for Images

        const images = document.getElementById("images");
        images.src = "images/image 2.jpg";
      };
    </script>
  </body>
</html>
